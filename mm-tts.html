<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>မြန်မာ Text-to-Speech (Edge TTS)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .tts-box {
      background: var(--card);
      width: 100%;
      max-width: 500px;
      padding: 2rem;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    h2 { font-size: 1.4rem; text-align: center; }
    textarea {
      width: 100%;
      height: 130px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 0.75rem;
      font-size: 1rem;
      resize: vertical;
    }
    textarea:focus { outline: 1px solid var(--accent); }
    .row { display: flex; flex-direction: column; gap: 0.4rem; }
    label { font-size: 0.85rem; color: var(--muted); }
    select, input[type="range"] {
      width: 100%;
      padding: 0.6rem;
      background: #0b1120;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    button {
      padding: 0.8rem;
      background: var(--accent);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    audio { width: 100%; margin-top: 0.5rem; display: none; }
    .status { font-size: 0.85rem; text-align: center; color: var(--muted); min-height: 1.2rem; word-break: break-word; }
  </style>
</head>
<body>

  <div class="tts-box">
    <h2>မြန်မာ အသံထွက်စနစ်</h2>

    <textarea id="text" placeholder="အသံထွက်စေချင်သည့် မြန်မာစာသား ရိုက်ထည့်ပါ..."></textarea>

    <div class="row">
      <label>အသံရွေးချယ်ရန်</label>
      <select id="voice">
        <option value="my-MM-NilarNeural">နီလာ (Nilar - အမျိုးသမီးသံ)</option>
        <option value="my-MM-ThihaNeural">သီဟ (Thiha - အမျိုးသားသံ)</option>
      </select>
    </div>

    <div class="row">
      <label>အမြန်နှုန်း: <span id="rate-val">0%</span></label>
      <input type="range" id="rate" min="-50" max="50" value="0" step="5" />
    </div>

    <button id="btn-convert">အသံပြောင်းမည်</button>
    <div class="status" id="status"></div>

    <audio id="player" controls></audio>
  </div>

  <script>
    // Cloudflare Worker URL
    const WORKER_URL = "https://myanmar-tts-worker.nainelinnoo.workers.dev";

    const textEl = document.getElementById("text");
    const voiceEl = document.getElementById("voice");
    const rateEl = document.getElementById("rate");
    const rateVal = document.getElementById("rate-val");
    const btn = document.getElementById("btn-convert");
    const statusEl = document.getElementById("status");
    const player = document.getElementById("player");

    rateEl.oninput = () => {
      rateVal.innerText = (rateEl.value > 0 ? "+" : "") + rateEl.value + "%";
    };

    btn.onclick = async () => {
      const text = textEl.value.trim();
      if (!text) {
        statusEl.innerText = "စာသား အရင်ရိုက်ထည့်ပါ။";
        return;
      }

      btn.disabled = true;
      statusEl.innerText = "အသံဖိုင် ဖန်တီးနေပါသည်...";
      player.style.display = "none";

      try {
        const resp = await fetch(`${WORKER_URL}/api/tts`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: text,
            voice: voiceEl.value,
            rate: (rateEl.value > 0 ? "+" : "") + rateEl.value + "%",
          }),
        });

        if (!resp.ok) {
          const errJson = await resp.json().catch(() => null);
          const errMsg = errJson && errJson.error ? errJson.error : `HTTP ${resp.status}`;
          throw new Error(errMsg);
        }

        const blob = await resp.blob();
        player.src = URL.createObjectURL(blob);
        player.style.display = "block";
        player.play();
        statusEl.innerText = "အသံဖိုင် အဆင်သင့်ဖြစ်ပါပြီ။";
      } catch (err) {
        statusEl.innerText = "အမှား: " + err.message;
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
