<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myanmar AI Tools Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      max-width: 450px;
      width: 100%;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
    p { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.8rem; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.9rem;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: 600;
      border-radius: 10px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>မြန်မာ TTS ဝန်ဆောင်မှု</h1>
    <p>သဘာဝကျသည့် မြန်မာအမျိုးသမီးနှင့် အမျိုးသား AI အသံထွက်များ ဖန်တီးနိုင်သော Web App ဖြစ်ပါသည်။</p>
    <a href="mm-tts.html" class="btn">TTS အသုံးပြုမည် →</a>
  </div>
</body>
</html>
