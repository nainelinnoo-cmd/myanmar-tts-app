<!DOCTYPE html>
<html lang="my" oncontextmenu="return false;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myanmar AI Portal - ပင်မစာမျက်နှာ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Padauk:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --silver-bg: #EAECEF;
      --silver-card: #FFFFFF;
      --silver-border: #D1D5DB;
      --gold-primary: #D4AF37;
      --gold-dark: #B8860B;
      --gold-light: #FDF8ED;
      --gold-glow: rgba(212, 175, 55, 0.25);
      --text-main: #1F2937;
      --text-sub: #4B5563;
    }

    /* စာသားများ Select မှတ်ခြင်းနှင့် Copy ကူးခြင်းကို ပိတ်ထားခြင်း */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background: linear-gradient(135deg, #ECEFF2 0%, #DDE2E6 100%);
      font-family: 'Padauk', 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    /* Top Nav */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #FFFFFF;
      border: 1px solid var(--silver-border);
      border-radius: 9999px;
      font-size: 13px;
      color: var(--gold-dark);
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .menu-trigger {
      background: #FFFFFF;
      border: 1px solid var(--silver-border);
      border-radius: 12px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    /* Drawer */
    .menu-drawer {
      position: fixed;
      top: 0;
      right: -280px;
      width: 270px;
      height: 100vh;
      background: #FFFFFF;
      border-left: 2px solid var(--gold-primary);
      box-shadow: -10px 0 25px rgba(0,0,0,0.15);
      z-index: 1000;
      transition: right 0.3s ease;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
    }
    .menu-drawer.open { right: 0; }
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.4);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .menu-overlay.open { opacity: 1; pointer-events: auto; }
    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid #E5E7EB;
      padding-bottom: 12px;
    }
    .menu-header h3 {
      font-family: 'Cinzel', serif;
      color: var(--gold-dark);
      font-size: 18px;
    }
    .close-btn { font-size: 24px; cursor: pointer; color: var(--text-sub); }
    .menu-items a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      margin-bottom: 10px;
      transition: 0.2s;
    }
    .menu-items a:hover, .menu-items a.active {
      background: var(--gold-light);
      color: var(--gold-dark);
    }

    /* Main Welcome Card */
    .card {
      background: var(--silver-card);
      border-radius: 24px;
      border: 1px solid var(--silver-border);
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    .hero-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .title {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      color: var(--text-main);
      margin-bottom: 8px;
    }
    .title span {
      color: var(--gold-dark);
    }
    .desc {
      font-size: 15px;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* Gold Action Button */
    .btn-gold-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 16px;
      box-shadow: 0 6px 20px var(--gold-glow);
      transition: all 0.2s;
    }
    .btn-gold-action:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Menu Drawer & Overlay -->
  <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
  <div class="menu-drawer" id="menuDrawer">
    <div class="menu-header">
      <h3>MENU</h3>
      <span class="close-btn" onclick="toggleMenu()">&times;</span>
    </div>
    <div class="menu-items">
      <a href="/" class="active">🏠 Main (ပင်မစာမျက်နှာ)</a>
      <a href="/mmvoice">🎙️ Myanmar Voice TTS</a>
    </div>
  </div>

  <div class="container">
    <div class="top-nav">
      <div class="brand-badge">✨ Myanmar AI Platform</div>
      <button class="menu-trigger" onclick="toggleMenu()">☰ Menu</button>
    </div>

    <div class="card">
      <div class="hero-icon">🎙️</div>
      <h1 class="title">Myanmar <span>Voice Hub</span></h1>
      <p class="desc">
        သဘာဝအကျဆုံးသော မြန်မာ AI အသံထွက်များ ဖန်တီးပေးသည့် နည်းပညာစနစ်မှ ကြိုဆိုပါသည်။
      </p>

      <a href="/mmvoice" class="btn-gold-action">
        ✨ အသံဖန်တီးမှု စနစ်သို့ သွားရန် (Open Voice TTS)
      </a>
    </div>
  </div>

  <script>
    function toggleMenu() {
      document.getElementById('menuDrawer').classList.toggle('open');
      document.getElementById('menuOverlay').classList.toggle('open');
    }
  </script>
</body>
</html>
