<!DOCTYPE html>
<html lang="my,en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07090e">
<title>Story to Video Studio Pro</title>

<style>
:root {
  --bg: #07090e;
  --panel: #0e121b;
  --panel2: #141a27;
  --panel3: #1a2234;
  --border: #232c3f;
  --border-light: #34415c;
  --text: #f5f7fb;
  --muted: #8e9bb2;
  --accent: #2bd576;
  --cyan: #20d7ff;
  --gold: #ffbe3b;
  --red: #ff5572;
  --shadow: 0 16px 44px rgba(0,0,0,0.42);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
input, textarea { user-select: text; }

html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Pyidaungsu", "Noto Sans Myanmar", "Segoe UI", sans-serif;
  line-height: 1.5; overflow-x: hidden; min-height: 100vh;
}

button, input, textarea, select { font: inherit; }
button {
  cursor: pointer; color: var(--text); background: var(--panel2);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 12px; font-weight: 600; font-size: 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.15s ease;
}
button:hover { border-color: var(--border-light); background: var(--panel3); }
button:active { transform: scale(0.97); }

.primary {
  background: linear-gradient(135deg, #2bd576, #20d7ff);
  border: 0; color: #07090e; font-weight: 800;
  box-shadow: 0 4px 14px rgba(43, 213, 118, 0.35);
}
.primary:disabled, button:disabled { opacity: 0.55; cursor: not-allowed; }

.voiceBtn.active { border-color: var(--cyan); background: rgba(32, 215, 255, 0.2); color: #fff; }

.aiGenBtn {
  background: linear-gradient(135deg, #ffbe3b, #ff7e40);
  border: 0; color: #07090e; font-weight: 800;
  box-shadow: 0 4px 14px rgba(255, 190, 59, 0.35);
}

.burnBtn {
  background: linear-gradient(135deg, #ff5572, #ffbe3b);
  border: 0; color: #fff; font-weight: 800;
  box-shadow: 0 4px 14px rgba(255, 85, 114, 0.35);
}

.customToolBtn {
  background: #121826; border: 1px solid var(--border-light);
  color: #fff; font-weight: 700; font-size: 11.5px;
}
.customToolBtn:hover { background: #1a2336; border-color: var(--cyan); }

.btnSpinner {
  width: 13px; height: 13px;
  border: 2px solid rgba(0,0,0,0.3); border-top-color: #000;
  border-radius: 50%; animation: spin 0.75s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.appHeader {
  position: sticky; top: 0; z-index: 60; height: 50px; padding: 0 14px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(7, 9, 14, 0.96); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }
.logo {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  background: linear-gradient(135deg, #2bd576, #20d7ff); font-size: 15px; color: #07090e;
}
.brand small { display: block; color: var(--muted); font-size: 8.5px; font-weight: 500; }
.headerBtns { display: flex; gap: 5px; align-items: center; }
.iconBtn { width: 32px; height: 32px; padding: 0; border-radius: 8px; font-size: 13px; }

.toast {
  position: fixed; left: 50%; top: 58px; transform: translateX(-50%) translateY(-20px);
  z-index: 10000; background: rgba(20, 27, 42, 0.96); border: 1px solid var(--border-light);
  padding: 8px 18px; border-radius: 12px; opacity: 0; transition: all 0.25s ease;
  font-size: 11.5px; font-weight: 600; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.container { max-width: 1400px; margin: auto; padding: 12px; }
.appBodyGrid {
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(420px, 0.85fr);
  gap: 16px; align-items: start;
}

.card {
  background: linear-gradient(180deg, #111521, #0c0f17);
  border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
  box-shadow: var(--shadow); margin-bottom: 14px; width: 100%;
}
.cardHead {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  cursor: pointer;
}
.cardHead.no-cursor { cursor: default; }
.title { font-weight: 750; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.body { padding: 12px 14px; }
.body.collapsed { display: none; }

.chevron { font-size: 11px; color: var(--muted); transition: transform 0.2s ease; }
.chevron.rotate { transform: rotate(180deg); }

.previewCanvasBox {
  position: relative; width: 100%; background: #020406;
  display: flex; align-items: center; justify-content: center;
  border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
}
.previewCanvasBox.landscape { aspect-ratio: 16/9; max-height: 380px; }
.previewCanvasBox.portrait { aspect-ratio: 9/16; max-height: 480px; margin: auto; max-width: 300px; }
canvas#videoCanvas { width: 100%; height: 100%; object-fit: contain; display: block; }

.canvasOverlayControls {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(180deg, transparent, rgba(6, 8, 14, 0.94));
  padding: 8px 12px; display: flex; align-items: center; gap: 8px;
  opacity: 0; transition: opacity 0.2s ease;
}
.previewCanvasBox:hover .canvasOverlayControls,
.canvasOverlayControls.show { opacity: 1; }

.vCtrlBtn { background: rgba(255, 255, 255, 0.16); border: 0; color: #fff; border-radius: 7px; padding: 5px 9px; font-size: 11px; font-weight: 700; }
.vTimeText { font-size: 10px; font-family: ui-monospace, monospace; color: #d0d7e5; min-width: 36px; text-align: center; }
.vSeekBar { flex: 1; accent-color: var(--accent); height: 6px; border-radius: 3px; cursor: pointer; }

.activeProgressOverlay {
  position: absolute; inset: 0; z-index: 45;
  background: rgba(5, 7, 12, 0.94); backdrop-filter: blur(10px);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; text-align: center;
}
.activeProgressOverlay.active { display: flex; }

.pulseSpinnerRing {
  width: 52px; height: 52px; border-radius: 50%;
  border: 3px solid rgba(32, 215, 255, 0.15);
  border-top-color: var(--cyan); border-right-color: var(--accent);
  animation: spin 0.85s linear infinite; margin-bottom: 14px;
}

.animTrack {
  width: 100%; max-width: 280px; height: 9px; background: #121826;
  border-radius: 99px; overflow: hidden; position: relative;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
  margin: 12px 0 8px 0;
}
.animBarFill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #ffbe3b, #2bd576, #20d7ff);
  background-size: 200% 100%;
  border-radius: 99px;
  transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  animation: shimmer 1.8s linear infinite;
  box-shadow: 0 0 12px rgba(43, 213, 118, 0.6);
}
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

/* Alert Banner For Long Scene Splits */
.splitAlertBanner {
  background: rgba(255, 190, 59, 0.12); border: 1px solid var(--gold);
  border-radius: 12px; padding: 10px 12px; margin-bottom: 12px;
  display: none; align-items: center; justify-content: space-between; gap: 8px;
}
.splitAlertBanner.show { display: flex; }
.splitAlertText { font-size: 11px; color: #ffebc2; font-weight: 600; line-height: 1.4; }
.splitActionBtn {
  background: linear-gradient(135deg, #ffbe3b, #ff7e40);
  border: 0; color: #000; font-weight: 800; font-size: 10.5px;
  padding: 6px 12px; border-radius: 8px; flex-shrink: 0;
}

.sceneList { display: flex; flex-direction: column; gap: 10px; max-height: 640px; overflow-y: auto; padding-right: 2px; }

.sceneCard {
  background: #090c14; border: 1px solid var(--border);
  border-radius: 12px; padding: 10px; display: flex; flex-direction: column;
  gap: 8px; width: 100%; box-sizing: border-box;
}
.sceneCard.activePlaying { border-color: var(--accent); background: rgba(43, 213, 118, 0.08); }

.sceneCardMainRow {
  display: flex; gap: 10px; align-items: center; width: 100%;
}

.sceneImgThumbBox {
  width: 76px; height: 76px; background: #121724; border-radius: 8px;
  border: 1px dashed var(--border-light); display: flex; flex-direction: column;
  align-items: center; justify-content: center; position: relative; overflow: hidden;
  cursor: pointer; flex-shrink: 0;
}
.sceneImgThumbBox.portrait { width: 56px; height: 86px; }
.sceneImgThumbBox img, .sceneImgThumbBox video { width: 100%; height: 100%; object-fit: cover; display: none; }
.sceneImgThumbBox span { font-size: 18px; color: var(--cyan); }
.sceneImgThumbBox small { font-size: 8.5px; color: var(--muted); font-weight: 700; margin-top: 2px; }

.sceneInfoCol { 
  display: flex; flex-direction: column; justify-content: space-between; 
  gap: 5px; flex: 1; min-width: 0; width: 100%;
}

.sceneHeaderRow { 
  display: flex; justify-content: space-between; align-items: center; 
  gap: 6px; width: 100%;
}

.sceneBadge { 
  font-size: 11px; font-weight: 800; color: var(--accent); white-space: nowrap; 
}

.sceneHeaderBtns {
  display: flex; gap: 5px; flex-shrink: 0; margin-left: auto;
}
.sceneHeaderBtns button {
  padding: 3px 7px; font-size: 9.5px; border-radius: 6px;
}

.sceneScriptScrollBox {
  width: 100%; overflow-x: auto; white-space: nowrap;
  scrollbar-width: none; -ms-overflow-style: none;
}
.sceneScriptScrollBox::-webkit-scrollbar { display: none; }
.sceneScriptText { 
  font-size: 12px; color: #f5f7fb; display: inline-block;
  user-select: text;
}

.scenePromptRow { 
  display: flex; align-items: center; gap: 6px; width: 100%; min-width: 0; 
}

.scenePromptScrollBox {
  flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap;
  background: #060910; padding: 4px 6px; border-radius: 6px;
  scrollbar-width: none; -ms-overflow-style: none;
}
.scenePromptScrollBox::-webkit-scrollbar { display: none; }
