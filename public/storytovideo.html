<!DOCTYPE html>
<html lang="my" oncontextmenu="return false;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Story to Video Studio Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Padauk:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #060913;
      --bg-panel: rgba(16, 24, 44, 0.75);
      --bg-surface: #0E162B;
      --border-panel: rgba(212, 175, 55, 0.22);
      --border-subtle: rgba(255, 255, 255, 0.08);
      
      --gold-primary: #D4AF37;
      --gold-hover: #F3C94D;
      --gold-glow: rgba(212, 175, 55, 0.35);
      
      --cyan-bright: #00E5FF;
      --emerald-accent: #10B981;
      --rose-accent: #F43F5E;
      
      --text-primary: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #152243 0%, #060913 75%);
      font-family: 'Padauk', 'Plus Jakarta Sans', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 820px;
      position: relative;
    }

    /* Top Navigation Bar */
    .studio-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-panel);
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .live-dot {
      width: 10px;
      height: 10px;
      background: var(--emerald-accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--emerald-accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--gold-primary);
      text-transform: uppercase;
    }

    .menu-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-panel);
      border-radius: 12px;
      padding: 8px 16px;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      position: relative;
      z-index: 100;
    }
    .menu-btn:hover {
      background: rgba(212, 175, 55, 0.15);
      border-color: var(--gold-primary);
      box-shadow: 0 0 14px var(--gold-glow);
    }

    /* Slide Menu Drawer (High Z-Index Fix) */
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      z-index: 9998;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .menu-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .menu-drawer {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100vh;
      background: #0A0F1D;
      border-left: 2px solid var(--gold-primary);
      box-shadow: -15px 0 40px rgba(0, 0, 0, 0.7);
      z-index: 9999;
      transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
    }
    .menu-drawer.open { right: 0; }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 24px;
    }
    .drawer-header h3 {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      color: var(--gold-primary);
    }
    .drawer-close {
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .drawer-links a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .drawer-links a:hover {
      background: rgba(212, 175, 55, 0.1);
      border-color: var(--border-panel);
      color: var(--gold-primary);
    }
    .drawer-links a.active {
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.2), transparent);
      border-left: 4px solid var(--gold-primary);
      color: var(--gold-primary);
    }

    /* Studio Card Panels */
    .studio-panel {
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
    }

    .viewport-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .panel-heading {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
    }

    .ratio-pill-box {
      display: flex;
      background: #070B16;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
    }
    .ratio-pill {
      padding: 6px 14px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .ratio-pill.active {
      background: var(--emerald-accent);
      color: #000;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.4);
    }

    /* Screen Viewport */
    .screen-container {
      width: 100%;
      background: #020409;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 18px;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
    }
    .screen-16-9 { aspect-ratio: 16 / 9; }
    .screen-9-16 { max-width: 340px; margin: 0 auto 18px auto; aspect-ratio: 9 / 16; }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .timeline-bar-wrap {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .timeline-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold-primary), var(--cyan-bright));
      transition: width 0.1s linear;
    }

    /* Action Deck */
    .action-deck {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .deck-btn {
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s ease;
      color: #FFF;
    }
    .btn-generate-voice {
      background: linear-gradient(135deg, #0284C7 0%, #06B6D4 100%);
      box-shadow: 0 4px 18px rgba(6, 182, 212, 0.35);
    }
    .btn-export-video {
      background: linear-gradient(135deg, #E11D48 0%, #F43F5E 100%);
      box-shadow: 0 4px 18px rgba(244, 63, 94, 0.35);
    }
    .deck-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .playback-toolbar {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 10px;
    }
    .tool-btn {
      padding: 11px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tool-btn:hover {
      background: rgba(212, 175, 55, 0.12);
      border-color: var(--border-panel);
    }

    /* Subtitle & Settings Section */
    .collapsible-trigger {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .setting-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }
    @media (max-width: 560px) { .setting-grid { grid-template-columns: 1fr; } }

    .control-cell label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .control-cell input[type=color] {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }

    .actor-toggle-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .actor-chip {
      flex: 1;
      padding: 12px;
      background: #090E1C;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .actor-chip.active {
      border-color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold-primary);
    }

    /* Scenes Timeline Header */
    .timeline-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
    .timeline-actions {
      display: flex;
      gap: 8px;
    }

    .btn-orange-auto {
      padding: 11px 20px;
      background: linear-gradient(135deg, #FFA033 0%, #FF6F00 100%);
      color: #000;
      font-size: 13.5px;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 18px rgba(255, 111, 0, 0.45);
      transition: all 0.2s;
    }
    .btn-orange-auto:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-clear-images {
      padding: 11px 16px;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #FDA4AF;
      font-size: 13px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .btn-clear-images:hover {
      background: rgba(244, 63, 94, 0.25);
    }

    /* Scene Timeline Items */
    .scene-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .scene-card.active-scene {
      border-color: var(--gold-primary);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
    }

    .scene-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .scene-index-badge {
      font-family: 'JetBrains Mono', monospace;
      color: var(--emerald-accent);
      font-size: 13px;
      font-weight: 700;
    }

    .scene-badges {
      display: flex;
      gap: 6px;
    }
    .action-chip {
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .action-chip:hover {
      background: rgba(212, 175, 55, 0.15);
      border-color: var(--gold-primary);
      color: var(--gold-primary);
    }

    .scene-body-split {
      display: flex;
      gap: 14px;
    }
    @media (max-width: 540px) { .scene-body-split { flex-direction: column; } }

    .preview-thumb-box {
      width: 110px;
      height: 88px;
      background: #070B16;
      border: 1.5px dashed var(--border-panel);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }
    .preview-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scene-details { flex: 1; }
    .script-burmese {
      font-size: 14px;
      line-height: 1.5;
      color: #E2E8F0;
      margin-bottom: 8px;
    }
    .prompt-snippet-box {
      background: #060913;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11.5px;
      color: var(--cyan-bright);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .copy-icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: #FFF;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 8px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Menu Drawer & Overlay -->
  <div class="menu-overlay" id="menuOverlay"></div>
  <div class="menu-drawer" id="menuDrawer">
    <div class="drawer-header">
      <h3>STUDIO MENU</h3>
      <div class="drawer-close" id="drawerCloseBtn">&times;</div>
    </div>
    <div class="drawer-links">
      <a href="/">🏠 Main Portal (ပင်မ)</a>
      <a href="/mmvoice">🎙️ Myanmar Voice TTS</a>
      <a href="/storycreate">📖 Story Create Studio</a>
      <a href="/storytovideo" class="active">🎬 Story to Video Studio</a>
    </div>
  </div>

  <div class="container">
    <!-- Navbar -->
    <nav class="studio-navbar">
      <div class="brand-group">
        <div class="live-dot"></div>
        <div class="brand-title">Video Studio Pro</div>
      </div>
      <button class="menu-btn" id="openMenuBtn">
        <span>☰</span>
        <span>Menu</span>
      </button>
    </nav>

    <!-- 1. Cinema Viewport Screen -->
    <div class="studio-panel">
      <div class="viewport-header">
        <div class="panel-heading">
          <span>🎬</span> Real-Time Video Preview
        </div>
        <div class="ratio-pill-box">
          <button class="ratio-pill active" id="btn169" onclick="setRatio('16:9')">📺 16:9</button>
          <button class="ratio-pill" id="btn916" onclick="setRatio('9:16')">📱 9:16</button>
        </div>
      </div>

      <div class="screen-container screen-16-9" id="screenBox">
        <canvas id="cinemaCanvas"></canvas>
      </div>

      <div class="timeline-bar-wrap">
        <div class="timeline-bar-fill" id="timelineProgress"></div>
      </div>

      <!-- Action Deck -->
      <div class="action-deck">
        <button class="deck-btn btn-generate-voice" id="genVoiceBtn" onclick="generateAllVoices()">
          🎙️ Generate Voices (အသံသွင်းမည်)
        </button>
        <button class="deck-btn btn-export-video" id="exportVideoBtn" onclick="exportVideoWithSound()">
          🎬 Export MP4 Video (အသံပါ ဗီဒီယို)
        </button>
      </div>

      <!-- Playback Controls -->
      <div class="playback-toolbar">
        <button class="tool-btn" onclick="stepScene(-1)">⏮️ Prev</button>
        <button class="tool-btn" id="playPauseBtn" onclick="togglePlayPreview()">⏯️ Play / Pause</button>
        <button class="tool-btn" onclick="stepScene(1)">Next ⏭️</button>
      </div>
    </div>

    <!-- 2. Subtitle & Voice Settings -->
    <div class="studio-panel">
      <div class="collapsible-trigger" onclick="toggleSettingsPanel()">
        <div class="panel-heading" style="color:var(--gold-primary);">
          <span>🎨</span> Subtitle & Voice Controls
        </div>
        <span id="settingsArrow" style="color:var(--text-muted); font-size:14px;">▲</span>
      </div>

      <div id="settingsContainer">
        <div class="setting-grid">
          <div class="control-cell">
            <label>Subtitle Text Color (စာလုံးအရောင်)</label>
            <input type="color" id="subColor" value="#FFFFFF" onchange="renderFrame()">
          </div>
          <div class="control-cell">
            <label>Subtitle Outline (ဘေးလိုင်းအရောင်)</label>
            <input type="color" id="subOutline" value="#000000" onchange="renderFrame()">
          </div>
        </div>

        <div class="actor-toggle-group">
          <div class="actor-chip" id="actorThiha" onclick="setVoiceActor('my-MM-ThihaNeural')">
            👦 သီဟ (ကျားသံ)
          </div>
          <div class="actor-chip active" id="actorNilar" onclick="setVoiceActor('my-MM-NilarNeural')">
            👩 နီလာ (မသံ)
          </div>
        </div>
      </div>
    </div>

    <!-- 3. Scenes Timeline Section -->
    <div class="studio-panel">
      <div class="timeline-top">
        <div class="panel-heading">
          <span>📸</span> Scenes Timeline <span id="sceneCountText" style="font-size:13px; color:var(--text-muted);">(0)</span>
        </div>
        <div class="timeline-actions">
          <button class="btn-clear-images" onclick="clearAllImages()">
            🗑️ Clear Images
          </button>
          <button class="btn-orange-auto" id="autoGenBtn" onclick="autoGenAllImages()">
            🎨 Auto Gen All Images
          </button>
        </div>
      </div>

      <div id="scenesTimelineList"></div>
    </div>
  </div>

  <audio id="studioAudioPlayer" style="display:none;"></audio>

  <script>
    // Menu Logic
    const menuDrawer = document.getElementById('menuDrawer');
    const menuOverlay = document.getElementById('menuOverlay');
    const openMenuBtn = document.getElementById('openMenuBtn');
    const drawerCloseBtn = document.getElementById('drawerCloseBtn');

    function openMenu() {
      menuDrawer.classList.add('open');
      menuOverlay.classList.add('open');
    }
    function closeMenu() {
      menuDrawer.classList.remove('open');
      menuOverlay.classList.remove('open');
    }

    openMenuBtn.addEventListener('click', openMenu);
    drawerCloseBtn.addEventListener('click', closeMenu);
    menuOverlay.addEventListener('click', closeMenu);

    // States
    let scenes = [];
    let selectedVoice = "my-MM-NilarNeural";
    let activeSceneIdx = 0;
    let isPlaying = false;

    const canvas = document.getElementById('cinemaCanvas');
    const ctx = canvas.getContext('2d');
    const audioPlayer = document.getElementById('studioAudioPlayer');

    function setRatio(ratio) {
      const box = document.getElementById('screenBox');
      document.getElementById('btn169').classList.toggle('active', ratio === '16:9');
      document.getElementById('btn916').classList.toggle('active', ratio === '9:16');

      if (ratio === '16:9') {
        box.className = "screen-container screen-16-9";
        canvas.width = 1280;
        canvas.height = 720;
      } else {
        box.className = "screen-container screen-9-16";
        canvas.width = 720;
        canvas.height = 1280;
      }
      renderFrame();
    }

    function toggleSettingsPanel() {
      const el = document.getElementById('settingsContainer');
      const arrow = document.getElementById('settingsArrow');
      if (el.style.display === "none") {
        el.style.display = "block";
        arrow.innerText = "▲";
      } else {
        el.style.display = "none";
        arrow.innerText = "▼";
      }
    }

    function setVoiceActor(v) {
      selectedVoice = v;
      document.getElementById('actorThiha').classList.toggle('active', v.includes('Thiha'));
      document.getElementById('actorNilar').classList.toggle('active', v.includes('Nilar'));
    }

    // Clear All Images
    function clearAllImages() {
      if (!confirm("ပုံဟောင်းများ အားလုံးကို ရှင်းလင်းဖျက်ထုတ်မလား?")) return;
      scenes.forEach(s => s.imageUrl = "");
      localStorage.setItem('video_studio_scenes', JSON.stringify(scenes));
      renderTimelineList();
      alert("ပုံဟောင်းများ အားလုံး ဖျက်ပြီးပါပြီ!");
    }

    function renderTimelineList() {
      const container = document.getElementById('scenesTimelineList');
      container.innerHTML = "";
      document.getElementById('sceneCountText').innerText = `(${scenes.length} Scenes)`;

      scenes.forEach((s, idx) => {
        const div = document.createElement('div');
        div.className = `scene-card ${idx === activeSceneIdx ? 'active-scene' : ''}`;
        div.id = `scene_card_${idx}`;
        div.innerHTML = `
          <div class="scene-head">
            <span class="scene-index-badge">SCENE #${idx + 1} (${s.time || '10s'})</span>
            <div class="scene-badges">
              <span class="action-chip" onclick="editScriptText(${idx})">📝 Edit</span>
              <span class="action-chip" onclick="genSingleAIImage(${idx}, this)">🎨 AI Gen</span>
              <span class="action-chip" onclick="playSingleVoice(${idx})">🔊 Voice</span>
            </div>
          </div>
          <div class="scene-body-split">
            <div class="preview-thumb-box" onclick="document.getElementById('upload_${idx}').click()">
              ${s.imageUrl ? `<img src="${s.imageUrl}" />` : `<span>📷 ပုံတင်ရန်</span>`}
              <input type="file" id="upload_${idx}" accept="image/*" style="display:none;" onchange="handleImageUpload(${idx}, event)">
            </div>
            <div class="scene-details">
              <div class="script-burmese">${s.text}</div>
              <div class="prompt-snippet-box">
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">🎨 ${s.prompt}</span>
                <button class="copy-icon-btn" onclick="navigator.clipboard.writeText('${s.prompt.replace(/'/g, "\\'")}')">📋 Copy</button>
              </div>
            </div>
          </div>
        `;
        container.appendChild(div);
      });
      renderFrame();
    }

    function editScriptText(idx) {
      const updated = prompt("Scene #" + (idx + 1) + " အတွက် မြန်မာစာသား ပြင်ဆင်ပါ:", scenes[idx].text);
      if (updated && updated.trim()) {
        scenes[idx].text = updated.trim();
        renderTimelineList();
      }
    }

    function handleImageUpload(idx, e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => {
          scenes[idx].imageUrl = ev.target.result;
          renderTimelineList();
        };
        reader.readAsDataURL(file);
      }
    }

    function renderFrame(idx = activeSceneIdx) {
      if (idx < 0 || idx >= scenes.length) idx = 0;
      const s = scenes[idx] || { text: "", imageUrl: "" };

      ctx.fillStyle = "#060913";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const drawSubtitles = () => {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, canvas.width, 64);
        ctx.fillStyle = "#D4AF37";
        ctx.font = "bold 22px 'Padauk', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`SCENE #${idx + 1}`, canvas.width / 2, 42);

        if (s.text) {
          ctx.font = "bold 32px 'Padauk', sans-serif";
          ctx.lineWidth = 6;
          ctx.strokeStyle = document.getElementById('subOutline').value;
          ctx.strokeText(s.text, canvas.width / 2, canvas.height * 0.82, canvas.width - 80);
          ctx.fillStyle = document.getElementById('subColor').value;
          ctx.fillText(s.text, canvas.width / 2, canvas.height * 0.82, canvas.width - 80);
        }
      };

      if (s.imageUrl) {
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          drawSubtitles();
        };
        img.src = s.imageUrl;
      } else {
        ctx.fillStyle = "#0E162B";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#64748B";
        ctx.font = "24px 'Padauk', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("📷 ပုံထည့်သွင်းပေးပါ (AI Gen သို့မဟုတ် Upload)", canvas.width / 2, canvas.height / 2);
        drawSubtitles();
      }
    }

    function stepScene(offset) {
      activeSceneIdx = Math.max(0, Math.min(scenes.length - 1, activeSceneIdx + offset));
      renderFrame(activeSceneIdx);
      updateActiveCard();
    }

    function updateActiveCard() {
      document.querySelectorAll('.scene-card').forEach((c, i) => {
        c.classList.toggle('active-scene', i === activeSceneIdx);
      });
      const percent = ((activeSceneIdx + 1) / scenes.length) * 100;
      document.getElementById('timelineProgress').style.width = `${percent}%`;
    }

    // Single AI Gen
    async function genSingleAIImage(idx, btn) {
      const originalText = btn.innerHTML;
      btn.innerHTML = "⏳ Drawing...";
      try {
        const res = await fetch('/api/generate-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: scenes[idx].prompt })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        scenes[idx].imageUrl = data.imageUrl;
        renderTimelineList();
      } catch (e) {
        alert("Image Gen Error: " + e.message);
      } finally {
        btn.innerHTML = originalText;
      }
    }

    // Robust Auto Gen All Images with 1.5s Delay
    async function autoGenAllImages() {
      if (!scenes || scenes.length === 0) return alert("Scene များ မရှိသေးပါ!");

      const btn = document.getElementById('autoGenBtn');
      btn.disabled = true;

      for (let i = 0; i < scenes.length; i++) {
        btn.innerHTML = `🎨 Drawing ${i + 1}/${scenes.length}...`;
        try {
          const res = await fetch('/api/generate-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: scenes[i].prompt })
          });
          const data = await res.json();
          if (res.ok && data.imageUrl) {
            scenes[i].imageUrl = data.imageUrl;
            renderTimelineList();
          }
        } catch (e) {
          console.error(e);
        }
        // Rate-limit ကာကွယ်ရန် ၁.၅ စက္ကန့် စောင့်ဆိုင်းခြင်း
        await new Promise(r => setTimeout(r, 1500));
      }

      btn.disabled = false;
      btn.innerHTML = "🎨 Auto Gen All Images";
      alert("Scene အားလုံးအတွက် AI ဓာတ်ပုံများ အောင်မြင်စွာ ရေးဆွဲပြီးပါပြီ!");
    }

    async function generateAllVoices() {
      const btn = document.getElementById('genVoiceBtn');
      btn.innerText = "⏳ Generating Voices...";
      btn.disabled = true;

      try {
        for (let i = 0; i < scenes.length; i++) {
          const res = await fetch('/api/tts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: scenes[i].text, voice: selectedVoice })
          });
          const blob = await res.blob();
          scenes[i].audioBlob = blob;
          scenes[i].audioUrl = URL.createObjectURL(blob);
        }
        alert("မြန်မာအသံဖိုင်များ အားလုံး အောင်မြင်စွာ ထုတ်ယူပြီးပါပြီ!");
        renderTimelineList();
      } catch (err) {
        alert("Voice Gen Error: " + err.message);
      } finally {
        btn.innerText = "🎙️ Generate Voices (အသံသွင်းမည်)";
        btn.disabled = false;
      }
    }

    async function playSingleVoice(idx) {
      if (scenes[idx].audioUrl) {
        audioPlayer.src = scenes[idx].audioUrl;
        audioPlayer.play();
        return;
      }
      try {
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: scenes[idx].text, voice: selectedVoice })
        });
        const blob = await res.blob();
        scenes[idx].audioBlob = blob;
        scenes[idx].audioUrl = URL.createObjectURL(blob);
        audioPlayer.src = scenes[idx].audioUrl;
        audioPlayer.play();
      } catch (e) {
        alert("TTS Error: " + e.message);
      }
    }

    function togglePlayPreview() {
      if (isPlaying) {
        audioPlayer.pause();
        isPlaying = false;
        document.getElementById('playPauseBtn').innerText = "⏯️ Play / Pause";
        return;
      }
      playSequence(0);
    }

    function playSequence(idx) {
      if (idx >= scenes.length) {
        isPlaying = false;
        document.getElementById('playPauseBtn').innerText = "⏯️ Play / Pause";
        return;
      }
      isPlaying = true;
      activeSceneIdx = idx;
      renderFrame(idx);
      updateActiveCard();
      document.getElementById('playPauseBtn').innerText = "⏸️ Stop Preview";

      if (scenes[idx].audioUrl) {
        audioPlayer.src = scenes[idx].audioUrl;
        audioPlayer.play();
        audioPlayer.onended = () => playSequence(idx + 1);
      } else {
        setTimeout(() => playSequence(idx + 1), 5000);
      }
    }

    async function exportVideoWithSound() {
      const btn = document.getElementById('exportVideoBtn');
      btn.innerText = "⏳ Rendering Video with Audio...";
      btn.disabled = true;

      const stream = canvas.captureStream(30);
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const dest = audioCtx.createMediaStreamDestination();

      const combinedStream = new MediaStream([
        ...stream.getVideoTracks(),
        ...dest.stream.getAudioTracks()
      ]);

      const recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/mp4' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `myanmar-story-video-${Date.now()}.mp4`;
        a.click();
        btn.innerText = "🎬 Export MP4 Video (အသံပါ ဗီဒီယို)";
        btn.disabled = false;
        alert("အသံပါဝင်သော ဗီဒီယို Export အောင်မြင်ပါပြီ!");
      };

      recorder.start();

      for (let i = 0; i < scenes.length; i++) {
        activeSceneIdx = i;
        renderFrame(i);
        updateActiveCard();
        if (scenes[i].audioBlob) {
          const arrBuf = await scenes[i].audioBlob.arrayBuffer();
          const audioBuf = await audioCtx.decodeAudioData(arrBuf);
          const srcNode = audioCtx.createBufferSource();
          srcNode.buffer = audioBuf;
          srcNode.connect(dest);
          srcNode.start();
          await new Promise(r => setTimeout(r, audioBuf.duration * 1000));
        } else {
          await new Promise(r => setTimeout(r, 4000));
        }
      }

      recorder.stop();
    }

    window.onload = () => {
      setRatio('16:9');
      const saved = localStorage.getItem('video_studio_scenes');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          // အရင် Demo ပုံဟောင်းများပါနေပါက ရှင်းလင်းဖယ်ရှားခြင်း
          scenes = parsed.map(s => ({
            ...s,
            imageUrl: (s.imageUrl && (s.imageUrl.includes('picsum.photos') || s.imageUrl.includes('seed/'))) ? "" : (s.imageUrl || "")
          }));
        } catch(e) {}
      }
      renderTimelineList();
    };
  </script>
</body>
