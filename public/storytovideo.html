<!DOCTYPE html>
<html lang="my" oncontextmenu="return false;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story to Video Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Padauk:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0B0F19;
      --card-dark: #151D2F;
      --card-border: #2A364F;
      --gold-primary: #D4AF37;
      --gold-dark: #B8860B;
      --silver-accent: #E2E8F0;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
    body {
      background: radial-gradient(circle at top, #1A233A 0%, #0B0F19 100%);
      font-family: 'Padauk', 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      padding: 16px; min-height: 100vh; display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 760px; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .brand-badge {
      padding: 6px 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 9999px; font-size: 13px; color: var(--gold-primary); font-weight: 700;
    }
    .menu-trigger {
      background: rgba(255,255,255,0.08); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 8px 16px; color: var(--silver-accent); cursor: pointer;
    }
    .menu-drawer {
      position: fixed; top: 0; right: -290px; width: 280px; height: 100vh;
      background: #111827; border-left: 2px solid var(--gold-primary); z-index: 1000;
      transition: right 0.3s ease; padding: 24px 20px; display: flex; flex-direction: column;
    }
    .menu-drawer.open { right: 0; }
    .menu-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.6); z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .menu-overlay.open { opacity: 1; pointer-events: auto; }
    .menu-header { display: flex; justify-content: space-between; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--card-border); }
    .menu-items a { display: block; padding: 13px 14px; text-decoration: none; color: var(--silver-accent); border-radius: 10px; margin-bottom: 8px; }
    .menu-items a.active { background: rgba(212, 175, 55, 0.15); color: var(--gold-primary); }

    .studio-card {
      background: var(--card-dark); border: 1px solid var(--card-border);
      border-radius: 20px; padding: 20px; margin-bottom: 18px;
    }
    .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .ratio-group { display: flex; background: #0B1329; padding: 3px; border-radius: 10px; }
    .ratio-btn {
      padding: 6px 12px; font-size: 12px; border: none; border-radius: 8px;
      background: transparent; color: var(--text-muted); cursor: pointer;
    }
    .ratio-btn.active { background: #10B981; color: #FFF; }
    
    .player-viewport {
      width: 100%; background: #000; border-radius: 14px; overflow: hidden;
      display: flex; justify-content: center; align-items: center; border: 1px solid #2A364F; margin-bottom: 16px;
    }
    .viewport-16-9 { aspect-ratio: 16 / 9; }
    .viewport-9-16 { max-width: 340px; margin: 0 auto 16px auto; aspect-ratio: 9 / 16; }
    canvas { width: 100%; height: 100%; object-fit: contain; }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .btn-action-lg {
      padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 700; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-teal { background: linear-gradient(135deg, #06B6D4, #0891B2); color: #FFF; }
    .btn-coral { background: linear-gradient(135deg, #F43F5E, #E11D48); color: #FFF; }
    .sub-btn-row { display: flex; gap: 8px; }
    .btn-sub {
      flex: 1; padding: 10px; background: #0B1329; border: 1px solid var(--card-border);
      border-radius: 10px; color: var(--silver-accent); font-size: 13px; font-weight: 600; cursor: pointer;
    }

    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .setting-item label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .setting-item input[type=color] { width: 100%; height: 38px; border: 1px solid var(--card-border); border-radius: 8px; background: transparent; cursor: pointer; }
    input[type=range] { width: 100%; accent-color: #10B981; }

    .chips-row { display: flex; gap: 10px; margin-top: 6px; }
    .chip-btn {
      flex: 1; padding: 10px; background: #0B1329; border: 1px solid var(--card-border);
      border-radius: 10px; color: var(--silver-accent); font-size: 13px; cursor: pointer;
    }
    .chip-btn.active { border-color: #06B6D4; background: rgba(6, 182, 212, 0.15); color: #38BDF8; }

    .scene-item { background: #0E1626; border: 1px solid var(--card-border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .scene-meta { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .scene-num { color: #10B981; font-size: 13px; font-weight: 700; }
    .scene-layout { display: flex; gap: 12px; }
    .thumb-slot {
      width: 105px; height: 85px; background: #151D2F; border: 1px dashed var(--card-border);
      border-radius: 10px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; font-size: 11px; color: var(--text-muted); cursor: pointer; overflow: hidden; flex-shrink: 0;
    }
    .thumb-slot img { width: 100%; height: 100%; object-fit: cover; }
    .scene-content { flex: 1; }
    .script-text { font-size: 13px; color: #E2E8F0; line-height: 1.45; margin-bottom: 6px; }
    .prompt-snippet {
      font-size: 11.5px; color: var(--text-muted); background: #0B0F19;
      padding: 6px 10px; border-radius: 8px; display: flex; justify-content: space-between;
    }
    .btn-copy { background: #1E293B; border: 1px solid var(--card-border); color: #FFF; font-size: 11px; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
  <div class="menu-drawer" id="menuDrawer">
    <div class="menu-header">
      <h3 style="font-family:'Cinzel'; color:var(--gold-primary);">STUDIO MENU</h3>
      <span style="font-size:24px; cursor:pointer;" onclick="toggleMenu()">&times;</span>
    </div>
    <div class="menu-items">
      <a href="/">🏠 Main Portal</a>
      <a href="/mmvoice">🎙️ Myanmar Voice TTS</a>
      <a href="/storycreate">📖 Story Create Studio</a>
      <a href="/storytovideo" class="active">🎬 Story to Video Studio</a>
    </div>
  </div>

  <div class="container">
    <div class="top-nav">
      <div class="brand-badge">✨ Video Studio Pro</div>
      <button class="menu-trigger" onclick="toggleMenu()">☰ Menu</button>
    </div>

    <!-- Preview & Player -->
    <div class="studio-card">
      <div class="preview-header">
        <strong style="font-size:15px; color:var(--silver-accent);">🎬 Real-Time Video Preview</strong>
        <div class="ratio-group">
          <button class="ratio-btn active" id="btn169" onclick="setRatio('16:9')">📺 16:9</button>
          <button class="ratio-btn" id="btn916" onclick="setRatio('9:16')">📱 9:16</button>
        </div>
      </div>

      <div class="player-viewport viewport-16-9" id="playerBox">
        <canvas id="videoCanvas" width="1280" height="720"></canvas>
      </div>

      <div class="btn-row">
        <button class="btn-action-lg btn-teal" id="genVoiceBtn" onclick="generateAllVoices()">
          🎙️ Generate Voices (အသံသွင်းမည်)
        </button>
        <button class="btn-action-lg btn-coral" id="exportVideoBtn" onclick="exportVideoWithSound()">
          🎬 Export MP4 Video (အသံပါ ဗီဒီယို)
        </button>
      </div>

      <div class="sub-btn-row">
        <button class="btn-sub" id="playBtn" onclick="togglePlayPreview()">⏯️ Play / Pause</button>
        <button class="btn-sub" onclick="copyFullScript()">📋 Copy All Script</button>
      </div>
    </div>

    <!-- Subtitle Controls -->
    <div class="studio-card">
      <h4 style="color:var(--gold-primary); margin-bottom:14px;">🎨 Subtitle & Voice Settings</h4>
      <div class="settings-grid">
        <div class="setting-item">
          <label>Subtitle Text Color</label>
          <input type="color" id="subColor" value="#FFFFFF" onchange="renderFrame()">
        </div>
        <div class="setting-item">
          <label>Subtitle Outline</label>
          <input type="color" id="subOutline" value="#000000" onchange="renderFrame()">
        </div>
      </div>

      <div style="margin-top:12px;">
        <label style="font-size:12px; color:var(--text-muted);">Voice Actor</label>
        <div class="chips-row">
          <button class="chip-btn" id="actorThiha" onclick="setActor('my-MM-ThihaNeural')">👦 သီဟ (ကျား)</button>
          <button class="chip-btn active" id="actorNilar" onclick="setActor('my-MM-NilarNeural')">👩 နီလာ (မ)</button>
        </div>
      </div>
    </div>

    <!-- Scenes Timeline -->
    <div class="studio-card">
      <div class="preview-header">
        <strong style="color:var(--silver-accent);">📸 Scenes Timeline <span id="sceneCount">(0)</span></strong>
      </div>
      <div id="scenesList"></div>
    </div>
  </div>

  <audio id="audioEngine" style="display:none;"></audio>

  <script>
    let scenes = [];
    let selectedVoice = "my-MM-NilarNeural";
    let isPlaying = false;
    let currentIdx = 0;
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const audioEngine = document.getElementById('audioEngine');

    function toggleMenu() {
      document.getElementById('menuDrawer').classList.toggle('open');
      document.getElementById('menuOverlay').classList.toggle('open');
    }

    function setRatio(ratio) {
      const box = document.getElementById('playerBox');
      document.getElementById('btn169').classList.toggle('active', ratio === '16:9');
      document.getElementById('btn916').classList.toggle('active', ratio === '9:16');
      if (ratio === '16:9') {
        box.className = "player-viewport viewport-16-9";
        canvas.width = 1280; canvas.height = 720;
      } else {
        box.className = "player-viewport viewport-9-16";
        canvas.width = 720; canvas.height = 1280;
      }
      renderFrame();
    }

    function setActor(v) {
      selectedVoice = v;
      document.getElementById('actorThiha').classList.toggle('active', v.includes('Thiha'));
      document.getElementById('actorNilar').classList.toggle('active', v.includes('Nilar'));
    }

    function renderTimeline() {
      const container = document.getElementById('scenesList');
      container.innerHTML = "";
      document.getElementById('sceneCount').innerText = `(${scenes.length} Scenes)`;

      scenes.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = "scene-item";
        item.innerHTML = `
          <div class="scene-meta">
            <span class="scene-num">SCENE #${idx + 1} (${s.time || '10s'})</span>
            <span style="font-size:12px; color:${s.audioUrl ? '#10B981' : '#F59E0B'}">${s.audioUrl ? '🔊 Voice Ready' : '🔇 No Voice'}</span>
          </div>
          <div class="scene-layout">
            <div class="thumb-slot" onclick="document.getElementById('file_${idx}').click()">
              ${s.imageUrl ? `<img src="${s.imageUrl}" />` : `<span>📷 ပုံတင်ရန်</span>`}
              <input type="file" id="file_${idx}" accept="image/*" style="display:none;" onchange="uploadImage(${idx}, event)">
            </div>
            <div class="scene-content">
              <div class="script-text">${s.text}</div>
              <div class="prompt-snippet">
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:80%;">${s.prompt}</span>
                <button class="btn-copy" onclick="navigator.clipboard.writeText('${s.prompt.replace(/'/g, "\\'")}')">📋 Copy</button>
              </div>
            </div>
          </div>
        `;
        container.appendChild(item);
      });
      renderFrame();
    }

    function uploadImage(idx, e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => {
          scenes[idx].imageUrl = ev.target.result;
          renderTimeline();
        };
        reader.readAsDataURL(file);
      }
    }

    function renderFrame(idx = currentIdx) {
      const s = scenes[idx] || { text: "", imageUrl: "" };
      ctx.fillStyle = "#0B0F19";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const drawOverlay = () => {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(0, 0, canvas.width, 60);
        ctx.fillStyle = "#D4AF37";
        ctx.font = "bold 22px Padauk";
        ctx.textAlign = "center";
        ctx.fillText(`SCENE #${idx + 1}`, canvas.width / 2, 40);

        if (s.text) {
          ctx.font = "bold 32px Padauk";
          ctx.lineWidth = 6;
          ctx.strokeStyle = document.getElementById('subOutline').value;
          ctx.strokeText(s.text, canvas.width / 2, canvas.height * 0.82, canvas.width - 80);
          ctx.fillStyle = document.getElementById('subColor').value;
          ctx.fillText(s.text, canvas.width / 2, canvas.height * 0.82, canvas.width - 80);
        }
      };

      if (s.imageUrl) {
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          drawOverlay();
        };
        img.src = s.imageUrl;
      } else {
        ctx.fillStyle = "#1E293B";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#64748B";
        ctx.font = "24px Padauk";
        ctx.textAlign = "center";
        ctx.fillText("📷 ပုံထည့်သွင်းပေးပါ", canvas.width / 2, canvas.height / 2);
        drawOverlay();
      }
    }

    async function generateAllVoices() {
      const btn = document.getElementById('genVoiceBtn');
      btn.innerText = "⏳ Generating Voices...";
      btn.disabled = true;

      try {
        for (let i = 0; i < scenes.length; i++) {
          const res = await fetch('/api/tts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: scenes[i].text, voice: selectedVoice })
          });
          const blob = await res.blob();
          scenes[i].audioBlob = blob;
          scenes[i].audioUrl = URL.createObjectURL(blob);
        }
        alert("မြန်မာအသံဖိုင်များ အားလုံး အောင်မြင်စွာ ထုတ်ယူပြီးပါပြီ!");
        renderTimeline();
      } catch (err) {
        alert("Voice Gen Error: " + err.message);
      } finally {
        btn.innerText = "🎙️ Generate Voices (အသံသွင်းမည်)";
        btn.disabled = false;
      }
    }

    function togglePlayPreview() {
      if (isPlaying) {
        audioEngine.pause();
        isPlaying = false;
        document.getElementById('playBtn').innerText = "⏯️ Play / Pause";
        return;
      }
      playSceneSequence(0);
    }

    function playSceneSequence(idx) {
      if (idx >= scenes.length) {
        isPlaying = false;
        document.getElementById('playBtn').innerText = "⏯️ Play / Pause";
        return;
      }
      isPlaying = true;
      currentIdx = idx;
      renderFrame(idx);
      document.getElementById('playBtn').innerText = "⏸️ Stop Preview";

      if (scenes[idx].audioUrl) {
        audioEngine.src = scenes[idx].audioUrl;
        audioEngine.play();
        audioEngine.onended = () => playSceneSequence(idx + 1);
      } else {
        setTimeout(() => playSceneSequence(idx + 1), 6000);
      }
    }

    async function exportVideoWithSound() {
      const btn = document.getElementById('exportVideoBtn');
      btn.innerText = "⏳ Rendering Video with Audio...";
      btn.disabled = true;

      const stream = canvas.captureStream(30);
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const dest = audioCtx.createMediaStreamDestination();

      const combinedStream = new MediaStream([
        ...stream.getVideoTracks(),
        ...dest.stream.getAudioTracks()
      ]);

      const recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/mp4' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `myanmar-story-video-${Date.now()}.mp4`;
        a.click();
        btn.innerText = "🎬 Export MP4 Video (အသံပါ ဗီဒီယို)";
        btn.disabled = false;
        alert("အသံပါဝင်သော ဗီဒီယို Export ပြီးပါပြီ!");
      };

      recorder.start();

      for (let i = 0; i < scenes.length; i++) {
        renderFrame(i);
        if (scenes[i].audioBlob) {
          const arrBuf = await scenes[i].audioBlob.arrayBuffer();
          const audioBuf = await audioCtx.decodeAudioData(arrBuf);
          const srcNode = audioCtx.createBufferSource();
          srcNode.buffer = audioBuf;
          srcNode.connect(dest);
          srcNode.start();
          await new Promise(r => setTimeout(r, audioBuf.duration * 1000));
        } else {
          await new Promise(r => setTimeout(r, 4000));
        }
      }

      recorder.stop();
    }

    function copyFullScript() {
      const fullText = scenes.map(s => s.text).join("\n\n");
      navigator.clipboard.writeText(fullText).then(() => alert("ဇာတ်လမ်းစာသားအားလုံး Copy ယူပြီးပါပြီ!"));
    }

    window.onload = () => {
      const saved = localStorage.getItem('video_studio_scenes');
      if (saved) {
        try {
          scenes = JSON.parse(saved);
        } catch(e) {}
      }
      renderTimeline();
    };
  </script>
</body>
</html>
