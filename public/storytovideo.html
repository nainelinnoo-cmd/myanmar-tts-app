<!DOCTYPE html>
<html lang="my" oncontextmenu="return false;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Story to Video Studio Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Padauk:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #060913;
      --bg-panel: rgba(14, 21, 38, 0.88);
      --bg-surface: #0E162B;
      --border-panel: rgba(212, 175, 55, 0.25);
      --border-subtle: rgba(255, 255, 255, 0.08);
      
      --gold-primary: #D4AF37;
      --gold-glow: rgba(212, 175, 55, 0.35);
      --cyan-bright: #00E5FF;
      --emerald-accent: #10B981;
      --rose-accent: #F43F5E;
      
      --text-primary: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #152243 0%, #060913 80%);
      font-family: 'Padauk', 'Plus Jakarta Sans', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      padding: 12px;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 820px;
      position: relative;
    }

    /* Studio Navbar */
    .studio-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-panel);
      border-radius: 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }
    .brand-group { display: flex; align-items: center; gap: 8px; }
    .live-dot {
      width: 8px; height: 8px; background: var(--emerald-accent);
      border-radius: 50%; box-shadow: 0 0 10px var(--emerald-accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .brand-title {
      font-family: 'Cinzel', serif; font-size: 14px; font-weight: 700;
      color: var(--gold-primary); text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* Panels */
    .studio-panel {
      background: var(--bg-panel); backdrop-filter: blur(14px);
      border: 1px solid var(--border-subtle); border-radius: 20px;
      padding: 16px; margin-bottom: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .panel-header-row {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    .panel-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }

    /* Canvas Screen & Touch Area */
    .screen-container {
      width: 100%; background: #020409; border-radius: 16px; overflow: hidden;
      display: flex; justify-content: center; align-items: center; position: relative;
      border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 12px;
      touch-action: none; cursor: grab;
    }
    .screen-container:active { cursor: grabbing; }
    .screen-16-9 { aspect-ratio: 16 / 9; }
    .screen-9-16 { max-width: 320px; margin: 0 auto 12px auto; aspect-ratio: 9 / 16; }
    canvas { width: 100%; height: 100%; display: block; }

    .ratio-pills { display: flex; background: #070B16; padding: 3px; border-radius: 10px; border: 1px solid var(--border-subtle); }
    .ratio-pill {
      padding: 5px 12px; border: none; border-radius: 7px; background: transparent;
      color: var(--text-muted); font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .ratio-pill.active { background: var(--emerald-accent); color: #000; }

    /* Topic Generator Bar */
    .generator-bar {
      display: flex; gap: 8px; margin-bottom: 14px;
    }
    .generator-bar input {
      flex: 1; padding: 11px 14px; border-radius: 12px; background: #070B16;
      border: 1px solid var(--border-panel); color: #FFF; font-size: 13.5px; outline: none;
      font-family: inherit; -webkit-user-select: text; user-select: text;
    }
    .generator-bar input:focus { border-color: var(--gold-primary); box-shadow: 0 0 10px var(--gold-glow); }
    .btn-create-story {
      padding: 11px 18px; border-radius: 12px; border: none; font-weight: 700;
      background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%); color: #000;
      cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px;
      white-space: nowrap; transition: 0.2s;
    }
    .btn-create-story:hover { opacity: 0.95; transform: translateY(-1px); }

    /* Compact Pro Button Deck */
    .compact-deck {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;
    }
    .btn-compact {
      padding: 11px 14px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
      color: #FFF; transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn-compact:active { transform: scale(0.97); }
    .btn-compact:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-voice { background: linear-gradient(135deg, #0284C7 0%, #06B6D4 100%); box-shadow: 0 4px 14px rgba(6, 182, 212, 0.3); }
    .btn-export { background: linear-gradient(135deg, #E11D48 0%, #F43F5E 100%); box-shadow: 0 4px 14px rgba(244, 63, 94, 0.3); }

    /* Playback Toolbar */
    .playback-toolbar { display: grid; grid-template-columns: 1fr 1.8fr 1fr; gap: 8px; }
    .tool-btn {
      padding: 9px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-subtle);
      border-radius: 10px; color: var(--text-primary); font-size: 12px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }

    /* Subtitle & Settings Tabs */
    .tab-pills { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 8px; }
    .tab-pill {
      padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
      cursor: pointer; background: transparent; border: 1px solid transparent; color: var(--text-muted);
    }
    .tab-pill.active { background: rgba(212, 175, 55, 0.15); border-color: var(--gold-primary); color: var(--gold-primary); }

    .control-row-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .ctrl-item label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .ctrl-item input[type=color] { width: 100%; height: 34px; border: 1px solid var(--border-subtle); border-radius: 8px; background: transparent; cursor: pointer; }
    .ctrl-item input[type=range] { width: 100%; accent-color: var(--emerald-accent); }
    .ctrl-item select {
      width: 100%; padding: 7px; border-radius: 8px; background: #070B16;
      border: 1px solid var(--border-subtle); color: #FFF; font-size: 12px; outline: none;
    }

    /* Style & Mood Toggle Chips */
    .chip-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .style-chip {
      padding: 7px 12px; background: #070B16; border: 1px solid var(--border-subtle);
      border-radius: 8px; font-size: 11.5px; color: var(--text-muted); cursor: pointer; font-weight: 600;
    }
    .style-chip.active {
      border-color: var(--gold-primary); background: rgba(212, 175, 55, 0.15); color: var(--gold-primary);
    }

    /* Vibrant Orange Auto Gen All Images Button */
    .btn-orange-auto {
      padding: 10px 18px; background: linear-gradient(135deg, #FFA033 0%, #FF6F00 100%);
      color: #000; font-size: 12.5px; font-weight: 800; border: none; border-radius: 12px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      box-shadow: 0 4px 14px rgba(255, 111, 0, 0.4);
    }
    .btn-clear-images {
      padding: 10px 14px; background: rgba(244, 63, 94, 0.12); border: 1px solid rgba(244, 63, 94, 0.3);
      color: #FDA4AF; font-size: 12px; font-weight: 700; border-radius: 12px; cursor: pointer;
    }

    /* Scene Card */
    .scene-card {
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: 16px; padding: 14px; margin-bottom: 12px;
    }
    .scene-card.active-scene { border-color: var(--gold-primary); box-shadow: 0 0 16px rgba(212, 175, 55, 0.2); }
    .scene-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .scene-index-badge { font-family: 'JetBrains Mono', monospace; color: var(--emerald-accent); font-size: 12.5px; font-weight: 700; }
    .action-chips { display: flex; gap: 6px; }
    .action-chip {
      padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;
      background: rgba(255, 255, 255, 0.05); color: var(--text-primary); border: 1px solid var(--border-subtle); cursor: pointer;
    }

    .scene-body-split { display: flex; gap: 12px; }
    @media (max-width: 520px) { .scene-body-split { flex-direction: column; } }
    .preview-thumb-box {
      width: 100px; height: 80px; background: #070B16; border: 1.5px dashed var(--border-panel);
      border-radius: 10px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; font-size: 11px; color: var(--text-muted); cursor: pointer; overflow: hidden; flex-shrink: 0;
    }
    .preview-thumb-box img { width: 100%; height: 100%; object-fit: cover; }
    .scene-details { flex: 1; }
    .script-burmese {
      font-size: 13.5px; line-height: 1.5; color: #E2E8F0; margin-bottom: 6px;
      -webkit-user-select: text; user-select: text;
    }
    .prompt-box-sm {
      background: #060913; border: 1px solid var(--border-subtle); border-radius: 8px;
      padding: 6px 10px; font-size: 11px; color: var(--cyan-bright); display: flex; justify-content: space-between; align-items: center;
    }

    /* REAL PERCENTAGE (%) ANIMATED PROGRESS MODAL */
    .progress-modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
      z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .progress-box {
      width: 100%; max-width: 360px; background: #0D1426; border: 1.5px solid var(--gold-primary);
      border-radius: 22px; padding: 28px 24px; text-align: center; box-shadow: 0 10px 40px var(--gold-glow);
    }
    .progress-circle-wrap {
      width: 110px; height: 110px; margin: 0 auto 18px auto; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .progress-circle-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .progress-circle-bg { fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-width: 8; }
    .progress-circle-bar {
      fill: none; stroke: url(#goldGrad); stroke-width: 8; stroke-linecap: round;
      stroke-dasharray: 283; stroke-dashoffset: 283; transition: stroke-dashoffset 0.25s ease;
    }
    .progress-percent-label {
      position: absolute; font-family: 'JetBrains Mono', monospace; font-size: 22px;
      font-weight: 800; color: #FFF; text-shadow: 0 0 10px var(--gold-glow);
    }
    .progress-status-title { font-size: 15px; font-weight: 700; color: var(--gold-primary); margin-bottom: 6px; }
    .progress-status-sub { font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navbar -->
    <nav class="studio-navbar">
      <div class="brand-group">
        <div class="live-dot"></div>
        <div class="brand-title">Story to Video Studio Pro</div>
      </div>
      <div style="font-size:12px; color:var(--gold-primary); font-weight:700;">🇲🇲 AI Video Engine</div>
    </nav>

    <!-- 0. Story & Scene Generation Input -->
    <div class="studio-panel">
      <div class="panel-header-row">
        <div class="panel-title"><span>📖</span> Story Topic မှ Scenes ခွဲထုတ်ခြင်း</div>
      </div>
      <div class="generator-bar">
        <input type="text" id="storyTopicInput" placeholder="ဥပမာ- ရွာထိပ်ညောင်ပင်ကြီးမှ သရဲ သို့မဟုတ် ပုဂံခေတ် သူရဲကောင်း...">
        <button class="btn-create-story" onclick="generateStoryScenes()">✨ ဇာတ်လမ်းဖန်တီးပါ</button>
      </div>
    </div>

    <!-- 1. Real-Time Viewport (Interactive Drag & Touch Supported) -->
    <div class="studio-panel">
      <div class="panel-header-row">
        <div class="panel-title"><span>🎬</span> Real-Time Video Preview</div>
        <div class="ratio-pills">
          <button class="ratio-pill active" id="btn169" onclick="setRatio('16:9')">📺 16:9</button>
          <button class="ratio-pill" id="btn916" onclick="setRatio('9:16')">📱 9:16</button>
        </div>
      </div>

      <!-- Touch/Drag Viewport Screen -->
      <div class="screen-container screen-16-9" id="screenBox">
        <canvas id="cinemaCanvas" width="1280" height="720"></canvas>
      </div>

      <!-- Compact Deck -->
      <div class="compact-deck">
        <button class="btn-compact btn-voice" id="genVoiceBtn" onclick="generateAllVoicesWithProgress()">
          🎙️ Generate Voices
        </button>
        <button class="btn-compact btn-export" id="exportVideoBtn" onclick="exportVideoWithProgress()">
          🎬 Export MP4 Video
        </button>
      </div>

      <!-- Controls -->
      <div class="playback-toolbar">
        <button class="tool-btn" onclick="stepScene(-1)">⏮️ Prev</button>
        <button class="tool-btn" id="playPauseBtn" onclick="togglePlayPreview()">⏯️ Play / Pause</button>
        <button class="tool-btn" onclick="stepScene(1)">Next ⏭️</button>
      </div>
    </div>

    <!-- 2. Overlay Customizers (Subtitles, BGM, Voice Actor) -->
    <div class="studio-panel">
      <div class="tab-pills">
        <button class="tab-pill active" id="tabSubBtn" onclick="switchTab('sub')">📝 Subtitles (SRT)</button>
        <button class="tab-pill" id="tabVoiceBtn" onclick="switchTab('voice')">🎙️ AI Voice Actor</button>
        <button class="tab-pill" id="tabBgmBtn" onclick="switchTab('bgm')">🎵 Background Music (BGM)</button>
      </div>

      <!-- Subtitle Controls -->
      <div id="subControlsBox">
        <p style="font-size:11.5px; color:#10B981; margin-bottom:8px;">💡 Screen ပေါ်ရှိ စာတန်းထိုးကို လက်ဖြင့် ဖိဆွဲပြီး လိုရာနေရာသို့ တိုက်ရိုက်ရွှေ့နိုင်ပါသည်။</p>
        <div class="control-row-grid">
          <div class="ctrl-item">
            <label>Text Color</label>
            <input type="color" id="subColor" value="#FFFFFF" onchange="renderFrame()">
          </div>
          <div class="ctrl-item">
            <label>Outline Color</label>
            <input type="color" id="subOutline" value="#000000" onchange="renderFrame()">
          </div>
          <div class="ctrl-item">
            <label>Font Size (<span id="subSizeVal">28</span>px)</label>
            <input type="range" id="subFontSize" min="16" max="44" value="28" oninput="document.getElementById('subSizeVal').innerText=this.value; renderFrame();">
          </div>
          <div class="ctrl-item">
            <label>Background Box</label>
            <select id="subBoxMode" onchange="renderFrame()">
              <option value="solid">Dark Box (ကြည်လင်ပြတ်သား)</option>
              <option value="none">Outline သီးသန့်</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Voice Actor Controls -->
      <div id="voiceControlsBox" style="display:none;">
        <div class="control-row-grid">
          <div class="ctrl-item">
            <label>Voice Actor</label>
            <select id="voiceActorSelect">
              <option value="my-MM-NilarNeural">နီလာ (အမျိုးသမီးသံ)</option>
              <option value="my-MM-ThihaNeural">သီဟ (အမျိုးသားသံ)</option>
            </select>
          </div>
          <div class="ctrl-item">
            <label>Voice Style / Mood</label>
            <select id="voiceStyleSelect">
              <option value="story">📖 ပုံပြင်/ဇာတ်လမ်းပြော (Story)</option>
              <option value="natural">😊 သဘာဝကျကျ (Natural)</option>
              <option value="horror">👻 သရဲ/သည်းထိတ် (Horror)</option>
              <option value="funny">🎭 ဟာသ/ပျော်ရွှင်ဖွယ် (Funny)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- BGM Controls -->
      <div id="bgmControlsBox" style="display:none;">
        <div class="control-row-grid">
          <div class="ctrl-item">
            <label>Ambient Mood Track</label>
            <select id="bgmTrackSelect" onchange="updateBgmTrack()">
              <option value="cinematic">🎻 Cinematic Ambient Drone</option>
              <option value="emotional">🎹 Emotional Piano Ambient</option>
              <option value="thriller">👻 Thriller / Suspense Dark Tone</option>
              <option value="lofi">☕ Calm Lofi Chill</option>
              <option value="none">🔇 No BGM (အသံပိတ်)</option>
            </select>
          </div>
          <div class="ctrl-item">
            <label>BGM Volume (<span id="bgmVolVal">25</span>%)</label>
            <input type="range" id="bgmVolume" min="0" max="100" value="25" oninput="updateBgmVolume(this.value)">
          </div>
        </div>
      </div>
    </div>

    <!-- 3. Scenes Timeline Section -->
    <div class="studio-panel">
      <div class="panel-header-row">
        <div class="panel-title">
          <span>📸</span> Scenes Timeline <span id="sceneCountText" style="font-size:12px; color:var(--text-muted);">(0)</span>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="btn-clear-images" onclick="clearAllImages()">🗑️ Clear</button>
          <button class="btn-orange-auto" id="autoGenBtn" onclick="autoGenAllImagesWithProgress()">
            🎨 Auto Gen All Images
          </button>
        </div>
      </div>

      <div id="scenesTimelineList"></div>
    </div>
  </div>

  <!-- Real Percentage Progress Modal -->
  <div class="progress-modal" id="progressModal">
    <div class="progress-box">
      <div class="progress-circle-wrap">
        <svg viewBox="0 0 100 100">
          <defs>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#D4AF37"/>
              <stop offset="100%" stop-color="#00E5FF"/>
            </linearGradient>
          </defs>
          <circle class="progress-circle-bg" cx="50" cy="50" r="45"></circle>
          <circle class="progress-circle-bar" id="progressCircleBar" cx="50" cy="50" r="45"></circle>
        </svg>
        <span class="progress-percent-label" id="progressPercentNum">0%</span>
      </div>
      <div class="progress-status-title" id="progressTitleText">လုပ်ဆောင်နေပါသည်...</div>
      <div class="progress-status-sub" id="progressSubText">ခဏစောင့်ဆိုင်းပေးပါ</div>
    </div>
  </div>

  <audio id="studioAudioPlayer" style="display:none;"></audio>

  <script>
    // Global App States
    let scenes = [];
    let activeSceneIdx = 0;
    let isPlaying = false;
    let kenBurnsProgress = 0;
    let animFrameId = null;

    // Subtitle Position for Drag/Touch
    let subPosition = { xPercent: 50, yPercent: 82 };
    let isDraggingSub = false;

    const canvas = document.getElementById('cinemaCanvas');
    const ctx = canvas.getContext('2d');
    const audioPlayer = document.getElementById('studioAudioPlayer');

    // Web Audio Synthesizer for Ambient BGM
    let audioCtx = null;
    let bgmGainNode = null;
    let bgmOscillators = [];

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        bgmGainNode = audioCtx.createGain();
        bgmGainNode.gain.value = 0.25;
        bgmGainNode.connect(audioCtx.destination);
      }
    }

    function startAmbientBGM(type) {
      initAudioContext();
      stopAmbientBGM();
      if (type === 'none') return;

      const baseFreq = type === 'thriller' ? 65 : type === 'emotional' ? 130 : type === 'lofi' ? 110 : 98;
      const chords = [1, 1.25, 1.5, 1.875];

      chords.forEach((ratio, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type === 'thriller' ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(baseFreq * ratio, audioCtx.currentTime);

        // Lowpass filter for smooth warmth
        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = type === 'thriller' ? 220 : 400;

        gain.gain.setValueAtTime(0.08 / (i + 1), audioCtx.currentTime);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(bgmGainNode);

        osc.start();
        bgmOscillators.push(osc);
      });
    }

    function stopAmbientBGM() {
      bgmOscillators.forEach(osc => {
        try { osc.stop(); osc.disconnect(); } catch(e) {}
      });
      bgmOscillators = [];
    }

    function updateBgmTrack() {
      const track = document.getElementById('bgmTrackSelect').value;
      if (isPlaying) startAmbientBGM(track);
    }

    function updateBgmVolume(val) {
      document.getElementById('bgmVolVal').innerText = val;
      if (bgmGainNode && audioCtx) {
        bgmGainNode.gain.setValueAtTime((val / 100) * 0.4, audioCtx.currentTime);
      }
    }

    function switchTab(tab) {
      ['sub', 'voice', 'bgm'].forEach(t => {
        document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}Btn`).classList.toggle('active', t === tab);
        document.getElementById(`${t}ControlsBox`).style.display = t === tab ? 'block' : 'none';
      });
    }

    function setRatio(ratio) {
      const box = document.getElementById('screenBox');
      document.getElementById('btn169').classList.toggle('active', ratio === '16:9');
      document.getElementById('btn916').classList.toggle('active', ratio === '9:16');
      if (ratio === '16:9') {
        box.className = "screen-container screen-16-9";
        canvas.width = 1280; canvas.height = 720;
      } else {
        box.className = "screen-container screen-9-16";
        canvas.width = 720; canvas.height = 1280;
      }
      renderFrame();
    }

    // Touch & Mouse Drag on Canvas for Subtitle Positioning
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = ((clientX - rect.left) / rect.width) * canvas.width;
      const y = ((clientY - rect.top) / rect.height) * canvas.height;
      return { x, y };
    }

    function onPointerDown(e) {
      isDraggingSub = true;
      onPointerMove(e);
    }
    function onPointerMove(e) {
      if (!isDraggingSub) return;
      if (e.cancelable) e.preventDefault();
      const { x, y } = getCanvasCoords(e);
      subPosition.xPercent = Math.max(10, Math.min(90, (x / canvas.width) * 100));
      subPosition.yPercent = Math.max(10, Math.min(95, (y / canvas.height) * 100));
      renderFrame();
    }
    function onPointerUp() { isDraggingSub = false; }

    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    // Canvas Render with Ken Burns Smooth Zoom & Subtitles
    function renderFrame(idx = activeSceneIdx, progress = kenBurnsProgress) {
      if (idx < 0 || idx >= scenes.length) idx = 0;
      const s = scenes[idx] || { text: "", imageUrl: "" };

      ctx.fillStyle = "#060913";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const drawSubtitles = () => {
        // Scene Top Badge
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, canvas.width, 54);
        ctx.fillStyle = "#D4AF37";
        ctx.font = "bold 20px 'Padauk', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`SCENE #${idx + 1} (${s.time || '10s'})`, canvas.width / 2, 36);

        // Subtitles with Outline & Box
        if (s.text) {
          const fontSize = parseInt(document.getElementById('subFontSize').value);
          const boxMode = document.getElementById('subBoxMode').value;
          const subX = (canvas.width * subPosition.xPercent) / 100;
          const subY = (canvas.height * subPosition.yPercent) / 100;

          ctx.font = `bold ${fontSize * 1.3}px 'Padauk', sans-serif`;
          ctx.textAlign = "center";

          if (boxMode === "solid") {
            const metrics = ctx.measureText(s.text);
            const textWidth = Math.min(canvas.width - 60, metrics.width + 36);
            ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
            ctx.fillRect(subX - (textWidth / 2), subY - (fontSize * 1.1), textWidth, fontSize * 1.6);
          }

          ctx.lineWidth = 6;
          ctx.strokeStyle = document.getElementById('subOutline').value;
          ctx.strokeText(s.text, subX, subY, canvas.width - 70);

          ctx.fillStyle = document.getElementById('subColor').value;
          ctx.fillText(s.text, subX, subY, canvas.width - 70);
        }
      };

      if (s.imageObj && s.imageObj.complete) {
        // Ken Burns Zoom In Effect
        const scale = 1.0 + (progress * 0.12);
        const w = canvas.width * scale;
        const h = canvas.height * scale;
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - h) / 2;

        ctx.drawImage(s.imageObj, x, y, w, h);
        drawSubtitles();
      } else if (s.imageUrl) {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          s.imageObj = img;
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          drawSubtitles();
        };
        img.src = s.imageUrl;
      } else {
        ctx.fillStyle = "#0E162B";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#64748B";
        ctx.font = "22px 'Padauk', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("📷 ပုံထည့်သွင်းပေးပါ (AI Gen သို့မဟုတ် Upload)", canvas.width / 2, canvas.height / 2);
        drawSubtitles();
      }
    }

    // Story Topic -> 4 to 8 Scenes Generator
    async function generateStoryScenes() {
      const topic = document.getElementById('storyTopicInput').value.trim();
      if (!topic) return alert("ဇာတ်လမ်းခေါင်းစဉ် အရင်ရိုက်ထည့်ပါ!");

      showProgress("ဇာတ်လမ်းနှင့် Scenes များ ခွဲထုတ်နေပါသည်", "AI Director Scripting...", 15);

      try {
        const res = await fetch('/api/generate-story', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            topic: topic,
            category: "story",
            duration: "2min",
            visualStyle: "Cinematic, Photorealistic lighting, highly detailed, Unreal Engine 5 render"
          })
        });

        if (res.ok) {
          const data = await res.json();
          if (data.scenes && data.scenes.length > 0) {
            scenes = data.scenes.map((s, i) => ({
              id: i + 1,
              time: s.time_range || "10s",
              text: s.myanmar_text,
              prompt: s.english_prompt,
              imageUrl: "",
              imageObj: null,
              audioBlob: null
            }));
            finishSceneGeneration();
            return;
          }
        }
      } catch (e) {
        console.warn("Backend API not reachable, switching to built-in smart generator...", e);
      }

      // Procedural 6-Scene Myanmar Story Generator Fallback
      scenes = [
        {
          id: 1, time: "10s",
          text: `ရှေးရှေးတုန်းက သာယာလှပတဲ့ မြစ်ကမ်းဘေးရွာလေးတစ်ရွာမှာ "${topic}" ဆိုတဲ့ ဒဏ္ဍာရီတစ်ခု အစပြုခဲ့ပါတယ်။`,
          prompt: `Cinematic wide shot establishing a peaceful traditional ancient Burmese riverside village at golden hour, lush palm trees, photorealistic, 8k resolution, Unreal Engine 5 render.`
        },
        {
          id: 2, time: "10s",
          text: `တစ်နေ့သော ညနေခင်းမှာတော့ ရွာသူရွာသားအားလုံး အံ့ဩတုန်လှုပ်သွားစေမယ့် ထူးဆန်းတဲ့ အဖြစ်အပျက်ကြီး စတင်ပေါ်ပေါက်လာခဲ့ပါတော့တယ်။`,
          prompt: `Dramatic medium shot of Burmese villagers whispering in fear and amazement at twilight, mysterious atmospheric fog, glowing lanterns, cinematic lighting.`
        },
        {
          id: 3, time: "10s",
          text: `အဲ့ဒီအရာကို စူးစမ်းရှာဖွေဖို့ ရဲရင့်တဲ့ လူငယ်တစ်ယောက်ဟာ လျှို့ဝှက်ဆန်းကြယ်တဲ့ နေရာဆီကို တစ်ယောက်တည်း ထွက်ခွာလာခဲ့တယ်။`,
          prompt: `Heroic back shot of a brave young Burmese adventurer walking towards a mysterious ancient forest temple, volumetric rays of sunlight, cinematic mist.`
        },
        {
          id: 4, time: "10s",
          text: `အမှောင်ထုဖုံးလွှမ်းနေတဲ့ နေရာကြီးထဲ ရောက်သွားတဲ့အခါ မထင်မှတ်ထားတဲ့ ကြီးမားသော လျှို့ဝှက်ချက်ကြီးကို တွေ့ရှိခဲ့ရပါတယ်။`,
          prompt: `Epic cinematic close-up of discovering an ancient golden artifact hidden deep inside a sacred cavern, glowing particles, dramatic shadows, hyper-detailed.`
        },
        {
          id: 5, time: "10s",
          text: `အခက်အခဲနဲ့ စိန်ခေါ်မှုများစွာကို ကျော်ဖြတ်ပြီးနောက် သူရဲကောင်းဟာ ရွာကလေးကို ဘေးအန္တရာယ်ကနေ အောင်မြင်စွာ ကယ်တင်နိုင်ခဲ့ပါတယ်။`,
          prompt: `Triumphant cinematic wide angle shot, heroic stance against a rising sun, atmospheric wind blowing through traditional robes, ultra-detailed.`
        },
        {
          id: 6, time: "10s",
          text: `ဒီနေ့အထိ ရွာသူရွာသားတွေဟာ ဒီဇာတ်လမ်းကို အမှတ်ရစရာ ဇာတ်လမ်းကောင်းတစ်ခုအဖြစ် လက်ဆင့်ကမ်း ပြောပြနေကြဆဲဖြစ်ပါတယ်။`,
          prompt: `Warm nostalgic wide shot of village elders telling stories around a nighttime fire under a starry sky, fireflies glowing, cinematic movie still.`
        }
      ];

      finishSceneGeneration();
    }

    function finishSceneGeneration() {
      hideProgress();
      renderTimelineList();
      alert(`Scene ${scenes.length} ခု အောင်မြင်စွာ ခွဲထုတ်ပြီးပါပြီ!`);
    }

    // Direct Pollinations AI Fetcher (Unique Seed Per Scene to Avoid Duplicate Caching)
    function buildUniquePollinationsUrl(prompt) {
      const uniqueSeed = Math.floor(Math.random() * 9999999);
      const uniqueTimestamp = Date.now();
      const cleanPrompt = encodeURIComponent(prompt.trim().slice(0, 320));
      return `https://image.pollinations.ai/prompt/${cleanPrompt}?width=1280&height=720&seed=${uniqueSeed}&model=flux&nologo=true&t=${uniqueTimestamp}`;
    }

    function preloadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve({ url, img });
        img.onerror = () => reject(new Error("Image Load Failed"));
        img.src = url;
      });
    }

    // Auto Gen All Images with Real % Progress
    async function autoGenAllImagesWithProgress() {
      if (!scenes || scenes.length === 0) return alert("Scenes များ မရှိသေးပါ!");
      showProgress("AI ပုံများ ဆွဲနေပါသည်", "0 / " + scenes.length, 0);

      for (let i = 0; i < scenes.length; i++) {
        const pct = Math.round(((i + 1) / scenes.length) * 100);
        showProgress("AI ပုံများ ဆွဲနေပါသည်", `Scene #${i + 1} of ${scenes.length}`, pct);

        const targetUrl = buildUniquePollinationsUrl(scenes[i].prompt);
        try {
          const res = await preloadImage(targetUrl);
          scenes[i].imageUrl = res.url;
          scenes[i].imageObj = res.img;
        } catch (e) {
          scenes[i].imageUrl = targetUrl;
        }

        renderTimelineList();
        // 1.2s delay to prevent server rate limiting
        await new Promise(r => setTimeout(r, 1200));
      }

      hideProgress();
      alert("Scene အားလုံးအတွက် AI ဓာတ်ပုံများ အောင်မြင်စွာ ဆွဲယူပြီးပါပြီ!");
    }

    // Single Scene AI Gen
    async function genSingleAIImage(idx, btn) {
      const originalText = btn.innerHTML;
      btn.innerHTML = "⏳ Gen...";
      const targetUrl = buildUniquePollinationsUrl(scenes[idx].prompt);

      try {
        const res = await preloadImage(targetUrl);
        scenes[idx].imageUrl = res.url;
        scenes[idx].imageObj = res.img;
        renderTimelineList();
      } catch (e) {
        scenes[idx].imageUrl = targetUrl;
        renderTimelineList();
      } finally {
        btn.innerHTML = originalText;
      }
    }

    // Generate Voices with Real % Progress & Mood Mapping
    async function generateAllVoicesWithProgress() {
      if (!scenes || scenes.length === 0) return alert("Scenes မရှိပါ!");
      showProgress("မြန်မာအသံဖိုင်များ ထုတ်လုပ်နေပါသည်", "စတင်နေပါသည်...", 0);

      const voice = document.getElementById('voiceActorSelect').value;
      const mood = document.getElementById('voiceStyleSelect').value;

      let rate = "+0%";
      let pitch = "+0Hz";

      if (mood === 'horror') { rate = "-15%"; pitch = "-10Hz"; }
      if (mood === 'funny') { rate = "+15%"; pitch = "+12Hz"; }
      if (mood === 'story') { rate = "-5%"; pitch = "-2Hz"; }

      for (let i = 0; i < scenes.length; i++) {
        const pct = Math.round(((i + 1) / scenes.length) * 100);
        showProgress("မြန်မာအသံဖိုင်များ ထုတ်လုပ်နေပါသည်", `Scene #${i + 1} / ${scenes.length}`, pct);

        try {
          const res = await fetch('/api/tts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: scenes[i].text, voice, rate, pitch })
          });
          if (res.ok) {
            const blob = await res.blob();
            scenes[i].audioBlob = blob;
            scenes[i].audioUrl = URL.createObjectURL(blob);
          }
        } catch (e) {
          console.warn("TTS API unreachable:", e);
        }
      }

      hideProgress();
      renderTimelineList();
      alert("မြန်မာအသံဖိုင်များ အောင်မြင်စွာ ထုတ်ယူပြီးပါပြီ!");
    }

    // Real-Time Playback Preview with Ken Burns Slideshow
    function togglePlayPreview() {
      if (isPlaying) {
        stopPlayback();
        return;
      }
      startPlayback();
    }

    function startPlayback() {
      isPlaying = true;
      document.getElementById('playPauseBtn').innerText = "⏸️ Stop Preview";
      const bgmTrack = document.getElementById('bgmTrackSelect').value;
      startAmbientBGM(bgmTrack);
      playSceneSequence(0);
    }

    function stopPlayback() {
      isPlaying = false;
      document.getElementById('playPauseBtn').innerText = "⏯️ Play / Pause";
      audioPlayer.pause();
      stopAmbientBGM();
      if (animFrameId) cancelAnimationFrame(animFrameId);
    }

    function playSceneSequence(idx) {
      if (!isPlaying) return;
      if (idx >= scenes.length) {
        stopPlayback();
        return;
      }

      activeSceneIdx = idx;
      updateActiveCard();

      let startTime = performance.now();
      let durationMs = 8000;

      if (scenes[idx].audioUrl) {
        audioPlayer.src = scenes[idx].audioUrl;
        audioPlayer.play();
        audioPlayer.onloadedmetadata = () => {
          durationMs = audioPlayer.duration * 1000;
        };
      }

      function animate(time) {
        if (!isPlaying || activeSceneIdx !== idx) return;
        const elapsed = time - startTime;
        kenBurnsProgress = Math.min(1.0, elapsed / durationMs);
        renderFrame(idx, kenBurnsProgress);

        if (elapsed < durationMs) {
          animFrameId = requestAnimationFrame(animate);
        } else {
          playSceneSequence(idx + 1);
        }
      }

      animFrameId = requestAnimationFrame(animate);
    }

    // Video Export with Real Audio & Video Synchronization
    async function exportVideoWithProgress() {
      if (!scenes || scenes.length === 0) return alert("Scenes မရှိပါ!");
      showProgress("ဗီဒီယို ဖန်တီးနေပါသည်", "Audio & Video ပေါင်းစပ်နေပါသည်...", 0);

      initAudioContext();
      const stream = canvas.captureStream(30);
      const dest = audioCtx.createMediaStreamDestination();

      const combinedStream = new MediaStream([
        ...stream.getVideoTracks(),
        ...dest.stream.getAudioTracks()
      ]);

      let recorder;
      try {
        recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
      } catch (e) {
        recorder = new MediaRecorder(combinedStream);
      }

      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/mp4' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `myanmar-story-video-${Date.now()}.mp4`;
        a.click();
        hideProgress();
        alert("အသံနှင့် Subtitle ပါဝင်သော ဗီဒီယို Export ပြီးပါပြီ!");
      };

      recorder.start();

      for (let i = 0; i < scenes.length; i++) {
        activeSceneIdx = i;
        updateActiveCard();
        const pct = Math.round(((i + 1) / scenes.length) * 100);
        showProgress("ဗီဒီယို ဖန်တီးနေပါသည်", `Scene #${i + 1} Render ပြုလုပ်နေသည်...`, pct);

        let durationSec = 6;
        if (scenes[i].audioBlob) {
          const arrBuf = await scenes[i].audioBlob.arrayBuffer();
          const audioBuf = await audioCtx.decodeAudioData(arrBuf);
          const srcNode = audioCtx.createBufferSource();
          srcNode.buffer = audioBuf;
          srcNode.connect(dest);
          srcNode.start();
          durationSec = audioBuf.duration;
        }

        const frames = Math.round(durationSec * 20);
        for (let f = 0; f <= frames; f++) {
          renderFrame(i, f / frames);
          await new Promise(r => setTimeout(r, 50));
        }
      }

      recorder.stop();
    }

    // UI Renderers & Helpers
    function renderTimelineList() {
      const container = document.getElementById('scenesTimelineList');
      container.innerHTML = "";
      document.getElementById('sceneCountText').innerText = `(${scenes.length} Scenes)`;

      scenes.forEach((s, idx) => {
        const div = document.createElement('div');
        div.className = `scene-card ${idx === activeSceneIdx ? 'active-scene' : ''}`;
        div.id = `card_${idx}`;
        div.innerHTML = `
          <div class="scene-head">
            <span class="scene-index-badge">SCENE #${idx + 1} (${s.time || '10s'})</span>
            <div class="action-chips">
              <span class="action-chip" onclick="genSingleAIImage(${idx}, this)">🎨 AI Gen</span>
              <span class="action-chip" onclick="playSingleVoice(${idx})">🔊 Voice</span>
            </div>
          </div>
          <div class="scene-body-split">
            <div class="preview-thumb-box" onclick="document.getElementById('up_${idx}').click()">
              ${s.imageUrl ? `<img src="${s.imageUrl}" />` : `<span>📷 Upload</span>`}
              <input type="file" id="up_${idx}" accept="image/*" style="display:none;" onchange="uploadThumb(${idx}, event)">
            </div>
            <div class="scene-details">
              <div class="script-burmese" contenteditable="true" onblur="scenes[${idx}].text=this.innerText; renderFrame();">${s.text}</div>
              <div class="prompt-box-sm">
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">🎨 ${s.prompt}</span>
                <span style="cursor:pointer;" onclick="navigator.clipboard.writeText('${s.prompt.replace(/'/g, "\\'")}')">📋</span>
              </div>
            </div>
          </div>
        `;
        container.appendChild(div);
      });
      renderFrame();
    }

    function uploadThumb(idx, e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => {
          scenes[idx].imageUrl = ev.target.result;
          scenes[idx].imageObj = null;
          renderTimelineList();
        };
        reader.readAsDataURL(file);
      }
    }

    function stepScene(offset) {
      activeSceneIdx = Math.max(0, Math.min(scenes.length - 1, activeSceneIdx + offset));
      renderFrame(activeSceneIdx);
      updateActiveCard();
    }

    function updateActiveCard() {
      document.querySelectorAll('.scene-card').forEach((c, i) => {
        c.classList.toggle('active-scene', i === activeSceneIdx);
      });
    }

    function playSingleVoice(idx) {
      if (scenes[idx].audioUrl) {
        audioPlayer.src = scenes[idx].audioUrl;
        audioPlayer.play();
      }
    }

    function clearAllImages() {
      if (!confirm("ပုံများ အားလုံးကို ရှင်းလင်းဖျက်ထုတ်မလား?")) return;
      scenes.forEach(s => { s.imageUrl = ""; s.imageObj = null; });
      renderTimelineList();
    }

    function showProgress(title, sub, pct) {
      document.getElementById('progressTitleText').innerText = title;
      document.getElementById('progressSubText').innerText = sub;
      document.getElementById('progressPercentNum').innerText = `${pct}%`;
      const offset = 283 - (283 * pct) / 100;
      document.getElementById('progressCircleBar').style.strokeDashoffset = offset;
      document.getElementById('progressModal').style.display = 'flex';
    }
    function hideProgress() {
      document.getElementById('progressModal').style.display = 'none';
    }

    // Auto-load on startup
    window.onload = () => {
      setRatio('16:9');
      const saved = localStorage.getItem('video_studio_scenes');
      if (saved) {
        try {
          scenes = JSON.parse(saved).map(s => ({ ...s, imageObj: null }));
        } catch(e) {}
      }
      renderTimelineList();
    };
  </script>
